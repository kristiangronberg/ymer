schema_version: "1.1"
name: setup-door
description: With no Ymer Node reachable, /ymer:setup fires, announces itself, and stops at check 1 naming the claude mcp add line.
plugins: ["../../plugins/ymer"]
runs: 1
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "/ymer:setup"
graders:
  - name: fired-plugin
    type: regex
    target: trace
    pattern: 'ymer@inline'
  - name: fired-command
    type: regex
    target: trace
    pattern: '"slash_commands":\[[^\]]*"ymer:setup"'
  - name: fired-announce
    type: regex
    target: trace
    pattern: 'Setup: checking the ymer environment\.'
  - name: no-mcp-server
    type: regex
    target: trace
    pattern: '"mcp_servers":\[\]'
  - name: no-mcp-call
    type: regex
    target: trace
    match: not_contains
    pattern: '"name":"mcp__'
  - name: door-named
    type: regex
    target: last_message
    flags: i
    pattern: 'claude mcp add --transport http --scope user ymer-node'
  - name: never-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: never-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: never-bash
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: never-notebookedit
    type: tool_used
    tool: NotebookEdit
    min: 0
    max: 0
